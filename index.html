<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MK-Smart Home Lab</title>
</head>
<body style="margin:0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#E6E9EC; --surface:#FFFFFF; --surface-2:#F1F4F6; --surface-3:#E4E9ED;
  --ink:#121A20; --ink-2:#556270; --ink-3:#8A97A3;
  --line:#D3DAE0; --line-soft:#E6EBEF;
  --accent:#0B7A85; --accent-ink:#FFFFFF; --accent-soft:#D9EEF0;
  --lamp:#D08A21; --lamp-soft:#F7E9CF;
  --good:#1C7C63; --warn:#98620B; --crit:#A6392C;
  --shadow:0 1px 2px rgba(18,26,32,.07), 0 10px 28px -14px rgba(18,26,32,.24);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A0F14; --surface:#141B21; --surface-2:#1A232A; --surface-3:#212C34;
    --ink:#E5EDF2; --ink-2:#93A2AF; --ink-3:#65747F;
    --line:#27333B; --line-soft:#1F2A31;
    --accent:#45C2CE; --accent-ink:#04151A; --accent-soft:#0E353B;
    --lamp:#E0A648; --lamp-soft:#2E2415;
    --good:#3EB392; --warn:#D79A31; --crit:#E07362;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#0A0F14; --surface:#141B21; --surface-2:#1A232A; --surface-3:#212C34;
  --ink:#E5EDF2; --ink-2:#93A2AF; --ink-3:#65747F;
  --line:#27333B; --line-soft:#1F2A31;
  --accent:#45C2CE; --accent-ink:#04151A; --accent-soft:#0E353B;
  --lamp:#E0A648; --lamp-soft:#2E2415;
  --good:#3EB392; --warn:#D79A31; --crit:#E07362;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 28px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:Archivo,"Noto Sans","PingFang SC","Hiragino Sans GB","Hiragino Sans","Yu Gothic UI","Meiryo","Malgun Gothic","Microsoft YaHei",system-ui,sans-serif;
  font-size:13px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace; font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:3px}

.app{display:grid; grid-template-rows:auto 1fr; height:100dvh; min-height:660px}
.top{display:flex; align-items:center; gap:14px; padding:10px 16px; background:var(--surface); border-bottom:1px solid var(--line)}
.brand h1{margin:0; font-size:15px; font-weight:600; letter-spacing:.01em; white-space:nowrap}
.brand .sub{font-size:10px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); white-space:nowrap}
.brand{display:flex; align-items:baseline; gap:10px}
.top .spacer{flex:1}
.btn{border:1px solid var(--line); background:var(--surface); color:var(--ink); padding:5px 11px; border-radius:6px; cursor:pointer; font-size:12.5px; display:inline-flex; align-items:center; gap:6px; white-space:nowrap}
.btn:hover{background:var(--surface-2); border-color:var(--ink-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2); color:var(--ink)}
.btn.sm{padding:3px 8px; font-size:11.5px}

.langsel{
  border:1px solid var(--line); background:var(--surface); color:var(--ink);
  padding:5px 8px; border-radius:6px; font-size:12.5px; cursor:pointer; max-width:132px;
}
.langsel:hover{border-color:var(--ink-3)}
.seg{display:flex; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:2px; gap:2px}
.seg button{border:0; background:transparent; padding:5px 13px; border-radius:5px; cursor:pointer; font-size:12.5px; font-weight:500; color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}

.wb{display:grid; grid-template-columns:232px minmax(0,1fr) 348px; min-height:0}
.rail{background:var(--surface); display:flex; flex-direction:column; min-height:0; overflow-y:auto}
.rail-l{border-right:1px solid var(--line)}
.rail-r{border-left:1px solid var(--line)}
.panel{padding:12px 14px; border-bottom:1px solid var(--line-soft)}
.panel > h3{
  margin:0 0 9px; font-size:10px; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3); font-weight:500;
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
}
.panel > h3 > span:first-child{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.panel > h3 .r{
  flex:none; max-width:58%; letter-spacing:0; text-transform:none; font-size:11px; color:var(--ink-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.empty{font-size:11.5px; color:var(--ink-3)}

.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{border:1px solid var(--line); background:var(--surface-2); border-radius:6px; padding:5px 9px; font-size:12px; cursor:grab; user-select:none; display:flex; gap:6px; align-items:center}
.chip:hover{border-color:var(--accent); background:var(--accent-soft)}
.chip.armed{border-color:var(--accent); background:var(--accent-soft)}
.chip .sw{width:9px; height:9px; border-radius:2px; flex:none}
.chip .dim{font-size:10.5px; color:var(--ink-3)}

.devrow{display:grid; grid-template-columns:24px 1fr auto; gap:9px; align-items:center; padding:7px 8px; border-radius:7px; border:1px solid transparent; cursor:pointer; user-select:none}
.devrow:hover{background:var(--surface-2); border-color:var(--line)}
.devrow .ic{width:24px; height:24px; border-radius:6px; display:grid; place-items:center; background:var(--surface-3); color:var(--ink-2)}
.devrow .nm{font-size:12px}
.devrow .dm{font-size:10.5px; color:var(--ink-3)}

/* ---- viewport ---- */
.stagewrap{position:relative; display:flex; flex-direction:column; min-width:0}
.vptools{display:flex; align-items:center; gap:6px; padding:7px 12px; background:var(--surface); border-bottom:1px solid var(--line); flex-wrap:wrap}
.vptools .sep{width:1px; height:18px; background:var(--line); margin:0 3px}
.tg{display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); cursor:pointer; padding:4px 6px; border-radius:5px}
.tg:hover{background:var(--surface-2)}
.tg input{accent-color:var(--accent); margin:0}
.vp{position:relative; flex:1; min-height:0; overflow:hidden; transition:background-color .45s ease}
.vp.grab{cursor:grabbing}
#svg{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
#svg text{pointer-events:none}
.roomg{cursor:move}
.pin{cursor:pointer}

.floornav{
  position:absolute; left:14px; top:14px; z-index:4; width:186px;
  background:var(--surface); border:1px solid var(--line); border-radius:9px;
  box-shadow:var(--shadow); overflow:hidden;
}
.fnhead{padding:7px 10px 6px; font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); border-bottom:1px solid var(--line-soft); display:flex; justify-content:space-between}
.fnrow{display:grid; grid-template-columns:auto 1fr auto; gap:8px; align-items:center; padding:6px 8px; cursor:pointer; border-bottom:1px solid var(--line-soft)}
.fnrow:hover{background:var(--surface-2)}
.fnrow.act{background:var(--accent-soft); box-shadow:inset 2px 0 0 var(--accent)}
.fnthumb{width:58px; height:34px; background:var(--surface-3); border-radius:4px; display:block; flex:none}
.fnthumb svg{display:block}
.fnmeta{min-width:0}
.fnmeta b{display:block; font-size:11.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.fnmeta span{font-size:10px; color:var(--ink-3); font-family:"DM Mono",monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:block}
.fnord{display:flex; flex-direction:column; gap:2px}
.fnord button{border:0; background:transparent; color:var(--ink-3); cursor:pointer; font-size:8px; line-height:1; padding:2px 3px; border-radius:3px}
.fnord button:hover{background:var(--surface-3); color:var(--ink)}
.fnbtns{display:flex; gap:5px; padding:7px 8px}
.fnbtns button{flex:1; border:1px solid var(--line); background:var(--surface-2); border-radius:5px; padding:4px 6px; font-size:11px; cursor:pointer; color:var(--ink-2)}
.fnbtns button:hover{border-color:var(--accent); color:var(--ink)}
.hud{position:absolute; left:14px; bottom:14px; z-index:3; display:flex; gap:8px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:6px 10px; box-shadow:var(--shadow); font-size:11.5px; color:var(--ink-2)}
.hud b{color:var(--ink); font-weight:500}

/* ---- light matrix ---- */
.matrix{display:grid; grid-template-columns:repeat(4,1fr); gap:5px}
.mcell{
  border:1px solid var(--line); border-radius:7px; padding:7px 5px; cursor:pointer; text-align:center;
  background:var(--surface-2); display:grid; gap:5px; justify-items:center;
}
.mcell:hover{border-color:var(--accent)}
.mcell[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent)}
.mcell .sw{width:100%; height:24px; border-radius:4px; border:1px solid rgba(0,0,0,.12)}
.mcell .lb{font-size:10px; line-height:1.25; color:var(--ink-2)}
.mnote{font-size:11px; color:var(--ink-3); margin-top:9px; line-height:1.55}
.mnote b{color:var(--ink-2); font-weight:500}

.slider{display:grid; grid-template-columns:auto 1fr auto; gap:9px; align-items:center; margin:7px 0}
.slider label{font-size:11.5px; color:var(--ink-2); white-space:nowrap}
.slider input[type=range]{width:100%; accent-color:var(--accent)}
.slider .v{font-size:11px; color:var(--ink-3); min-width:34px; text-align:right}

/* ---- entity list ---- */
.ent{display:grid; grid-template-columns:22px 1fr auto; gap:9px; align-items:center; padding:8px 0; border-bottom:1px solid var(--line-soft)}
.ent:last-child{border-bottom:0}
.ent .dot{width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font-size:11px}
.ent .dot.on{background:var(--lamp-soft); color:var(--lamp)}
.ent .dot.off{background:var(--surface-3); color:var(--ink-3)}
.ent .eid{font-size:10.5px; color:var(--ink-3); word-break:break-all}
.ent .nm{font-size:12px}
.sw-toggle{width:34px; height:19px; border-radius:11px; border:1px solid var(--line); background:var(--surface-3); position:relative; cursor:pointer; padding:0; flex:none}
.sw-toggle::after{content:""; position:absolute; top:2px; left:2px; width:13px; height:13px; border-radius:50%; background:var(--ink-3); transition:transform .16s ease, background .16s ease}
.sw-toggle[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent)}
.sw-toggle[aria-pressed="true"]::after{transform:translateX(15px); background:var(--accent)}

.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:12px}
.tabs button{border:0; background:transparent; padding:7px 11px; cursor:pointer; font-size:12.5px; color:var(--ink-2); border-bottom:2px solid transparent; margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--ink); border-bottom-color:var(--accent); font-weight:500}
pre.code{
  margin:0; background:var(--surface-2); border:1px solid var(--line); border-radius:7px; padding:11px;
  font-family:"DM Mono",monospace; font-size:11px; line-height:1.55; overflow:auto; max-height:52vh; white-space:pre;
}
.modal{position:fixed; inset:0; z-index:50; display:grid; place-items:center; background:rgba(10,15,20,.6); padding:22px}
.modal .box{background:var(--surface); border:1px solid var(--line); border-radius:11px; box-shadow:var(--shadow); width:min(860px,94vw); max-height:88vh; overflow:auto; padding:18px}
.modal h2{margin:0 0 3px; font-size:15px; font-weight:600}
.modal p{margin:0 0 12px; font-size:12px; color:var(--ink-2)}
.modal img{max-width:100%; border:1px solid var(--line); border-radius:7px; display:block}
.rowbtns{display:flex; gap:7px; margin-top:12px; flex-wrap:wrap; justify-content:flex-end}
.toast{position:fixed; left:50%; bottom:26px; transform:translateX(-50%); z-index:60; background:#121A20; color:#E9EFF3; padding:8px 15px; border-radius:7px; font-size:12.5px; box-shadow:var(--shadow); pointer-events:none}
.callout{background:var(--surface-2); border-left:3px solid var(--accent); border-radius:0 6px 6px 0; padding:9px 11px; font-size:11.5px; color:var(--ink-2); line-height:1.55; margin-bottom:12px}
.callout b{color:var(--ink); font-weight:500}

@media (max-width:1200px){
  .app{height:auto}
  .wb{grid-template-columns:1fr}
  .rail{border:0; border-top:1px solid var(--line)}
  .rail-l{order:2} .stagewrap{order:1} .rail-r{order:3}
  .vp{height:60vh; min-height:420px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>MK-Smart Home Lab</h1><span class="sub mono">ISO SCENE · HA READY</span></div>
    <div class="spacer"></div>
    <div class="seg" role="group">
      <button id="tod-day" aria-pressed="true" data-i18n="day" data-pre="☀ "></button>
      <button id="tod-night" aria-pressed="false" data-i18n="night" data-pre="☾ "></button>
    </div>
    <button class="btn" id="all-on" data-i18n="allOn"></button>
    <button class="btn" id="all-off" data-i18n="allOff"></button>
    <div class="spacer"></div>
    <select class="langsel" id="lang" aria-label="Language"></select>
    <button class="btn" id="btn-sample" data-i18n="sample"></button>
    <button class="btn" id="btn-png" data-i18n="exportPng"></button>
    <button class="btn primary" id="btn-ha" data-i18n="exportHa"></button>
  </header>

  <div class="wb">
    <aside class="rail rail-l">
      <div class="panel">
        <h3 data-i18n="roomBlocks"></h3>
        <div class="chips" id="roompal"></div>
      </div>
      <div class="panel">
        <h3><span data-i18n="devices"></span><span class="r" id="dev-target"></span></h3>
        <div id="devpal"></div>
      </div>
    </aside>

    <main class="stagewrap">
      <div class="vptools">
        <button class="btn ghost" id="zoom-out" aria-label="Zoom out">−</button>
        <span class="mono" id="zoomval" style="font-size:11.5px;color:var(--ink-3);min-width:42px;text-align:center">100%</span>
        <button class="btn ghost" id="zoom-in" aria-label="Zoom in">+</button>
        <button class="btn ghost" id="zoom-fit" data-i18n="center"></button>
        <span class="sep"></span>
        <label class="tg"><input type="checkbox" id="t-pins" checked> <span data-i18n="pins"></span></label>
        <label class="tg"><input type="checkbox" id="t-names" checked> <span data-i18n="roomNames"></span></label>
        <label class="tg"><input type="checkbox" id="t-grid" checked> <span data-i18n="isoGrid"></span></label>
        <span class="sep"></span>
        <button class="btn ghost" id="btn-del" data-i18n="delSel"></button>
      </div>
      <div class="vp" id="vp"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg><div class="floornav" id="floornav"></div></div>
      <div class="hud"><span id="hud-txt" data-i18n="hud"></span></div>
    </main>

    <aside class="rail rail-r">
      <div class="panel">
        <h3><span data-i18n="matrix"></span><span class="r" id="mx-now">—</span></h3>
        <div class="matrix" id="matrix"></div>
        <div class="mnote" id="mx-note"></div>
      </div>
      <div class="panel">
        <h3 data-i18n="global"></h3>
        <div class="slider"><label data-i18n="gBri"></label><input type="range" id="g-bri" min="1" max="100" value="85"><span class="v mono" id="g-bri-v">85%</span></div>
        <div class="slider"><label data-i18n="gCov"></label><input type="range" id="g-cov" min="0" max="100" value="100"><span class="v mono" id="g-cov-v">100%</span></div>
      </div>
      <div class="panel">
        <h3><span data-i18n="roomsEntities"></span><span class="r" id="ent-count">—</span></h3>
        <div id="entpanel"></div>
      </div>
    </aside>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="box">
    <h2 id="modal-title"></h2>
    <p id="modal-desc"></p>
    <div id="modal-body"></div>
    <div class="rowbtns">
      <button class="btn" id="modal-copy" hidden data-i18n="copyTab"></button>
      <button class="btn primary" id="modal-close" data-i18n="close"></button>
    </div>
  </div>
</div>

rni. Kształty czyta się wyłącznie z sylwetki, a okno jest najjaśniejszym punktem kadru.","n.night|open|on": "Noc, lampy włączone, zasłony otwarte. Ciepłe wnętrze kontra zimny błękit; okno staje się czarną dziurą, a ciepła kałuża gwałtownie opada. Najbardziej dramatyczny stan.","n.night|closed|off": "Noc, lampy wyłączone, zasłony zaciągnięte. Czarny punkt odniesienia, ledwie tyle rozdzielenia, by odczytać kontury — stan „nikogo nie ma w domu”.","n.night|closed|on": "Noc, lampy włączone, zasłony zaciągnięte. Ciepłe światło odbija się od tkaniny, opada najwolniej i otula wnętrze. Domyślny obraz „domu”.","nameJoin": " "},"ru": {"lang": "Язык","day": "День","night": "Ночь","allOn": "Включить весь свет","allOff": "Выключить весь свет","sample": "Загрузить пример","exportPng": "Экспорт PNG","exportHa": "Экспорт в Home Assistant","roomBlocks": "Блоки комнат","devices": "Устройства","noRoomSel": "Комната не выбрана","dev.ceiling_light": "Умный потолочный светильник","dev.dimmer": "Диммер","dev.smart_switch": "Умный выключатель","dev.curtain": "Умная штора","dev.roller": "Рулонная штора","h.ceiling_light": "light · brightness + color_temp","h.dimmer": "light · brightness · диммирует свет","h.smart_switch": "switch · вкл/выкл · управляет светом","h.curtain": "cover · curtain · position","h.roller": "cover · shade · position","room.living": "Гостиная","room.dining": "Столовая","room.kitchen": "Кухня","room.master": "Спальня хозяев","room.bedroom": "Спальня","room.kids": "Детская","room.study": "Кабинет","room.bath": "Ванная","room.balcony": "Балкон","room.entry": "Прихожая","room.hall": "Коридор","center": "Вписать","pins": "Метки сущностей","roomNames": "Названия комнат","isoGrid": "Изосетка","delSel": "Удалить выбранное","hud": "Перетащите блоки на сцену · зазоры расставляются сами · клик по комнате — выбор · клик по светильнику или выключателю — переключение · клавиша D — день/ночь","floors": "Этажи","addFloor": "+ Добавить этаж","delFloor": "Удалить этаж","emptyFloor": "пус }

/* ═══════════════════════════════════════════════════════════
   0 · 等距投影

var TW=30, TH=15, ZH=19;                 // 每个网格单元的投影半宽/半高/层高像素
function P(x,y,z){ return [(x-y)*TW, (x+y)*TH - (z||0)*ZH]; }
function un(sx,sy){ return { x:(sx/TW + sy/TH)/2, y:(sy/TH - sx/TW)/2 }; }

function h2r(h){ h=h.replace('#',''); return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]; }
function r2h(c){ return '#'+c.map(function(v){ v=Math.max(0,Math.min(255,Math.round(v))); return (v<16?'0':'')+v.toString(16); }).join(''); }
function mixc(a,b,t){ var A=h2r(a),B=h2r(b); return r2h([A[0]+(B[0]-A[0])*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t]); }
function litc(hex, L, face){
  var c=h2r(hex), m=L.mul*face;
  c=[c[0]*m, c[1]*m, c[2]*m];
  var t=h2r(L.tint), a=L.amt;
  // tint 在暗处更强，模拟环境色渗透
  return r2h([c[0]+(t[0]-c[0])*a, c[1]+(t[1]-c[1])*a, c[2]+(t[2]-c[2])*a]);
}

/* 名称全部按当前语言派生：切语言 → 房间名 / 实体名 / 楼层名同步变 */
function areaName(a){ return T('room.'+a.type) + (a.seq>1 ? ' '+a.seq : ''); }
function entName(e){ var a=areaById(e.area_id); return (a?areaName(a):'') + T('nameJoin') + T('dev.'+e.kind); }
function floorName(f){ return T('floorName',{n:(f.level||0)+1}); }
function renumberFloors(){ S.floors.forEach(function(f,k){ f.level=S.floors.length-1-k; }); }
function slug(s,n){ return s+(n>1?'_'+n:''); }

var AREA_SLUG={living:'living_room',dining:'dining_room',kitchen:'kitchen',master:'master_bedroom',
  bedroom:'bedroom',kids:'kids_room',study:'study',bath:'bathroom',balcony:'balcony',entry:'entryway',hall:'hallway'};

function newArea(type, gx, gy){
  var t=ROOMT[type], n=1, base=AREA_SLUG[type];
  while(S.areas.some(function(a){ return a.area_id===slug(base,n); })) n++;
  return {
    area_id:slug(base,n), seq:n, type:type,
    floor_id:S.activeFloor, x:gx, y:gy, w:t.w, d:t.d, _k:uid()
  };
}
function addEntity(area, kind, opts){
  opts=opts||{};
  var t=DEVT[kind], n=1;
  var mk=function(i){ return t.domain+'.'+area.area_id+'_'+t.suffix+(i>1?'_'+i:''); };
  while(S.entities.some(function(e){ return e.entity_id===mk(n); })) n++;
  var e={
    entity_id:mk(n), area_id:area.area_id, floor_id:area.floor_id,
    domain:t.domain, kind:kind,
    state:opts.state || (t.domain==='cover'?'open':'on'),
    attributes:t.attrs(),
    anchor:opts.anchor || defaultAnchor(area, kind)
  };
  if(t.domain==='cover'){
    e.attributes.current_position = opts.position!==undefined? opts.position : 100;
    e.state = e.attributes.current_position>0 ? 'open':'closed';
  }
  S.entities.push(e);
  return e;
}
function defaultAnchor(area, kind){
  var t=ROOMT[area.type];
  if(kind==='ceiling_light') return {mode:'ceiling', u:0.5, v:0.5};
  if(kind==='curtain') return {mode:'window', win:t.win.indexOf('R')>=0?'R':(t.win[0]||'R')};
  if(kind==='roller')  return {mode:'window', win:t.win.indexOf('L')>=0?'L':(t.win[0]||'R')};
  // 开关：贴左墙（x=0 面），沿 y 依次排开
  var used=S.entities.filter(function(e){ return e.area_id===area.area_id && (e.kind==='dimmer'||e.kind==='smart_switch'); }).length;
  return {mode:'wall', wall:'L', t:Math.min(0.86, 0.72 - used*0.16), z:1.22};
}
function entOf(area){ return S.entities.filter(function(e){ return e.area_id===area.area_id; }); }
function areaById(id){ for(var i=0;i<S.areas.length;i++) if(S.areas[i].area_id===id) return S.areas[i]; return null; }
function visibleAreas(){ return S.areas.filter(function(a){ return a.floor_id===S.activeFloor; }); }

/* 房间当前光照 */
function roomState(area){
  var es=entOf(area);
  var lit=false, bri=0, n=0;
  es.forEach(function(e){
    if(e.domain==='light' && e.state==='on'){ lit=true; n++; bri=Math.max(bri,(e.attributes.brightness||255)/255); }
    if(e.domain==='switch' && e.state==='on'){ lit=true; n++; bri=Math.max(bri,1); }
  });
  var covers=es.filter(function(e){ return e.domain==='cover'; });
  var cov = covers.length ? covers.reduce(function(m,e){ return Math.max(m,(e.attributes.current_position||0)/100); },0) : 1;
  var t=ROOMT[area.type];
  if(!t.win.length) cov=0;
  var base=LIGHT[lkey(S.tod, cov, lit)];
  /* 多灯叠加：2 盏比 1 盏明显亮一档；3 盏及以上封顶，与 2 盏一致 */
  var gain = lit ? (1 + 0.19*(Math.min(n,2)-1)) : 1;
  var L = base;
  if(gain!==1){
    L={mul:base.mul*gain, tint:base.tint, amt:base.amt/gain, shaft:base.shaft,
       pool:Math.min(1, base.pool*gain), sky:base.sky, bg:base.bg, veil:base.veil/gain, note:base.note};
  }
  return {lit:lit, bri:bri||0, n:n, gain:gain, cov:cov, L:L, covers:covers, hasWin:t.win.length>0};
}

var svg=document.getElementById('svg'), vp=document.getElementById('vp');
var defsHTML='';
function poly(pts, fill, extra){
  return '<polygon points="'+pts.map(function(p){ return p[0].toFixed(1)+','+p[1].toFixed(1); }).join(' ')+
    '" fill="'+fill+'"'+(extra||'')+'/>';
}
function faceZ(z,x0,x1,y0,y1,c){ return poly([P(x0,y0,z),P(x1,y0,z),P(x1,y1,z),P(x0,y1,z)],c); }
function faceX(x,y0,y1,z0,z1,c){ return poly([P(x,y0,z0),P(x,y1,z0),P(x,y1,z1),P(x,y0,z1)],c); }
function faceY(y,x0,x1,z0,z1,c){ return poly([P(x0,y,z0),P(x1,y,z0),P(x1,y,z1),P(x0,y,z1)],c); }

function drawBox(o,L){
  var base=MAT[o.m]||o.m;
  var s='';
  s+=faceZ(o.z+o.h, o.x,o.x+o.w, o.y,o.y+o.d, litc(base,L,F_TOP));
  s+=faceX(o.x+o.w, o.y,o.y+o.d, o.z,o.z+o.h, litc(base,L,F_XL));
  s+=faceY(o.y+o.d, o.x,o.x+o.w, o.z,o.z+o.h, litc(base,L,F_YR));
  return s;
}
function drawRug(o,L){
  var c=P(o.x,o.y,0.005);
  return '<ellipse cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" rx="'+(o.r*TW*1.414).toFixed(1)+
    '" ry="'+(o.r*TH*1.414).toFixed(1)+'" fill="'+litc(MAT[o.m],L,0.96)+'"/>';
}
function drawPan(o,L){
  var c=litc(MAT[o.m],L,F_XL);
  return faceX(o.x+o.w, o.y,o.y+o.d, o.z,o.z+o.h, c).replace('/>',' opacity="0.42"/>')
       + faceY(o.y+o.d, o.x,o.x+o.w, o.z,o.z+o.h, litc(MAT[o.m],L,F_YR)).replace('/>',' opacity="0.30"/>');
}

/* 窗洞几何：R 窗在 y=0 墙（向右下延伸），L 窗在 x=0 墙（向左下延伸） */
function winRect(area, which){
  var t=ROOMT[area.type];
  if(which==='R'){ var cx=area.w/2; return {a:Math.max(0.35,cx-0.95), b:Math.min(area.w-0.35,cx+0.95), z0:0.82, z1:2.05}; }
  var cy=area.d/2; return {a:Math.max(0.35,cy-0.85), b:Math.min(area.d-0.35,cy+0.85), z0:0.82, z1:2.05};
}

var gid=0;
function grad(stops, type, attrs){
  var id='g'+(++gid);
  defsHTML += '<'+(type||'linearGradient')+' id="'+id+'" '+(attrs||'')+'>'+stops+'</'+(type||'linearGradient')+'>';
  return id;
}

function drawRoom(area){
  var t=ROOMT[area.type], rs=roomState(area), L=rs.L;
  var w=area.w, d=area.d;
  var s='';

  /* 底板 */
  s+=faceX(w, -WT, d, -SB, 0, litc(MAT.slab,L,F_XL));
  s+=faceY(d, -WT, w, -SB, 0, litc(MAT.slab,L,F_YR));

  /* 地面 */
  s+=faceZ(0, 0,w, 0,d, litc(MAT[t.floor],L,F_TOP));
  /* 地砖纹理（湿区） */
  if(t.floor!=='floorWood'){
    var lc=litc(MAT[t.floor],L,0.90);
    for(var gx=1; gx<w; gx++) s+='<line x1="'+P(gx,0)[0].toFixed(1)+'" y1="'+P(gx,0)[1].toFixed(1)+'" x2="'+P(gx,d)[0].toFixed(1)+'" y2="'+P(gx,d)[1].toFixed(1)+'" stroke="'+lc+'" stroke-width="1"/>';
    for(var gy=1; gy<d; gy++) s+='<line x1="'+P(0,gy)[0].toFixed(1)+'" y1="'+P(0,gy)[1].toFixed(1)+'" x2="'+P(w,gy)[0].toFixed(1)+'" y2="'+P(w,gy)[1].toFixed(1)+'" stroke="'+lc+'" stroke-width="1"/>';
  }

  /* 左墙 x=0（向左下），右墙 y=0（向右下） */
  var wallL=litc(MAT.wall,L,F_XL), wallR=litc(MAT.wall,L,F_YR);
  s+=faceX(0, 0,d, 0,H, wallL);
  s+=faceY(0, 0,w, 0,H, wallR);

  /* 窗洞 */
  var wins=[];
  t.win.forEach(function(which){
    var r=winRect(area, which);
    var skyc=L.sky;
    if(which==='R'){
      s+=faceY(0, r.a,r.b, r.z0,r.z1, skyc);
      s+=faceY(0, r.a,r.b, r.z0,r.z1, 'none').replace('fill="none"','fill="none" stroke="'+litc(MAT.cap,L,0.9)+'" stroke-width="2"');
    } else {
      s+=faceX(0, r.a,r.b, r.z0,r.z1, skyc);
      s+=faceX(0, r.a,r.b, r.z0,r.z1, 'none').replace('fill="none"','fill="none" stroke="'+litc(MAT.cap,L,0.9)+'" stroke-width="2"');
    }
    wins.push({which:which, r:r});
  });

  /* 墙帽 + 墙端截面 */
  var capc=litc(MAT.cap,L,F_TOP);
  s+=faceZ(H, -WT,0, -WT,d, capc);
  s+=faceZ(H, 0,w, -WT,0, capc);
  s+=faceY(d, -WT,0, 0,H, litc(MAT.cap,L,F_YR));
  s+=faceX(w, -WT,0, 0,H, litc(MAT.cap,L,F_XL));

  /* 家具 */
  (FURN[area.type]||[]).forEach(function(o){
    if(o.k==='b')   s+=drawBox(o,L);
    else if(o.k==='rug') s+=drawRug(o,L);
    else if(o.k==='pan') s+=drawPan(o,L);
  });

  /* ── 光效层 ── */
  s+=lightFX(area, rs, wins);

  /* 吸顶灯灯具 */
  entOf(area).filter(function(e){ return e.kind==='ceiling_light'; }).forEach(function(e){
    var cx=area.w*(e.anchor.u||0.5), cy=area.d*(e.anchor.v||0.5);
    var on=e.state==='on';
    s+=drawBox({x:cx-0.34,y:cy-0.34,z:H-0.13,w:0.68,d:0.68,h:0.09, m: on?'shade':'white'}, on?{mul:1.35,tint:'#FFE9C0',amt:0.55}:L);
  });

  /* 窗帘 / 卷帘 */
  entOf(area).filter(function(e){ return e.domain==='cover'; }).forEach(function(e){
    var which=e.anchor.win||'R';
    if(t.win.indexOf(which)<0) return;
    var r=winRect(area, which), pos=(e.attributes.current_position||0)/100;
    s+=drawCover(e, which, r, pos, L, area);
  });

  /* 墙面开关面板 */
  entOf(area).filter(function(e){ return e.kind==='dimmer'||e.kind==='smart_switch'; }).forEach(function(e){
    var on=e.state==='on', a=e.anchor;
    var z=a.z||1.22, tt=a.t||0.7, pw=0.34;
    var plate = on ? litc(MAT.shade,{mul:1.25,tint:'#FFE0A8',amt:0.4},1) : litc(MAT.white,L,0.98);
    if(a.wall==='R'){
      var x0=area.w*tt-pw/2;
      s+=faceY(0.001, x0, x0+pw, z-0.20, z+0.20, plate);
    } else {
      var y0=area.d*tt-pw/2;
      s+=faceX(0.001, y0, y0+pw, z-0.20, z+0.20, plate);
    }
  });

  return s;
}

function drawCover(e, which, r, pos, L, area){
  var s='', open=pos, kind=e.kind;
  var fab = kind==='roller' ? MAT.offwhite : MAT.fabricWarm;
  var col = litc(fab, L, which==='R'?F_YR:F_XL);
  var col2= litc(fab, L, (which==='R'?F_YR:F_XL)*0.86);
  if(kind==='roller'){
    /* 卷帘：从上往下放，pos=100 全收起 */
    var drop = r.z0 + (r.z1-r.z0)*open;      // 帘底高度
    if(open<0.995){
      if(which==='R') s+=faceY(-0.02, r.a, r.b, drop, r.z1, col);
      else            s+=faceX(-0.02, r.a, r.b, drop, r.z1, col);
      /* 卷帘横向纹路 */
      var n=Math.max(1,Math.round((r.z1-drop)/0.16));
      for(var i=1;i<n;i++){
        var zz=drop+(r.z1-drop)*i/n;
        if(which==='R') s+=faceY(-0.021, r.a, r.b, zz, zz+0.02, col2);
        else            s+=faceX(-0.021, r.a, r.b, zz, zz+0.02, col2);
      }
    }
    /* 卷筒 */
    if(which==='R') s+=faceY(-0.03, r.a-0.06, r.b+0.06, r.z1, r.z1+0.14, litc(MAT.metal,L,F_YR));
    else            s+=faceX(-0.03, r.a-0.06, r.b+0.06, r.z1, r.z1+0.14, litc(MAT.metal,L,F_XL));
  } else {
    /* 窗帘：左右对开，pos=100 全部收到两侧 */
    var span=(r.b-r.a), half=span/2;
    var closedW = half*(1-open) + 0.14;      // 每片当前覆盖宽度
    var A={a:r.a-0.10, b:r.a-0.10+closedW};
    var B={a:r.b+0.10-closedW, b:r.b+0.10};
    [A,B].forEach(function(p){
      if(which==='R') s+=faceY(-0.04, p.a, p.b, r.z0-0.12, r.z1+0.16, col);
      else            s+=faceX(-0.04, p.a, p.b, r.z0-0.12, r.z1+0.16, col);
      var folds=Math.max(2,Math.round((p.b-p.a)/0.16));
      for(var i=1;i<folds;i++){
        var xx=p.a+(p.b-p.a)*i/folds;
        if(which==='R') s+=faceY(-0.045, xx, xx+0.025, r.z0-0.12, r.z1+0.16, col2);
        else            s+=faceX(-0.045, xx, xx+0.025, r.z0-0.12, r.z1+0.16, col2);
      }
    });
    /* 窗帘杆 */
    if(which==='R') s+=faceY(-0.06, r.a-0.20, r.b+0.20, r.z1+0.16, r.z1+0.22, litc(MAT.metal,L,F_YR));
    else            s+=faceX(-0.06, r.a-0.20, r.b+0.20, r.z1+0.16, r.z1+0.22, litc(MAT.metal,L,F_XL));
  }
  return s;
}

/* 光效叠加层：窗光投射 + 灯光池 + 夜色蒙版 */
function lightFX(area, rs, wins){
  var L=rs.L, s='', w=area.w, d=area.d;

  /* 1) 夜色/暗部蒙版：整间地面+两墙压暗，越暗越蓝 */
  if(L.veil>0.01){
    var vc = S.tod==='night' ? '#0A1426' : '#5B6B7A';
    var op = L.veil*(1-0.55*rs.bri*(rs.lit?1:0));
    s+='<g style="mix-blend-mode:multiply" opacity="'+op.toFixed(3)+'">';
    s+=faceZ(0.004, 0,w, 0,d, vc);
    s+=faceX(0.004, 0,d, 0,H, vc);
    s+=faceY(0.004, 0,w, 0,H, vc);
    s+='</g>';
  }

  /* 2) 窗光投射：从窗洞沿 +y / +x 方向铺一块梯形光斑 */
  if(L.shaft>0.02 && wins.length){
    var warm = S.tod==='day' ? '#FFFDF4' : '#9FC0E8';
    wins.forEach(function(win){
      var r=win.r, reach=Math.min(S.tod==='day'?3.1:1.5, (win.which==='R'? d : w)*0.85);
      var amt=L.shaft*rs.cov;
      var id=grad('<stop offset="0" stop-color="'+warm+'" stop-opacity="'+(0.92*amt).toFixed(3)+'"/>'+
                  '<stop offset="0.55" stop-color="'+warm+'" stop-opacity="'+(0.38*amt).toFixed(3)+'"/>'+
                  '<stop offset="1" stop-color="'+warm+'" stop-opacity="0"/>',
                  'linearGradient','x1="0" y1="0" x2="0" y2="1"');
      var pts;
      if(win.which==='R'){
        pts=[P(r.a,0.01,0.006), P(r.b,0.01,0.006), P(r.b+0.55, reach,0.006), P(r.a+0.55, reach,0.006)];
      } else {
        pts=[P(0.01,r.a,0.006), P(0.01,r.b,0.006), P(reach, r.b+0.55,0.006), P(reach, r.a+0.55,0.006)];
      }
      s+='<g style="mix-blend-mode:screen">'+poly(pts,'url(#'+id+')')+'</g>';
      /* 窗洞自发光 */
      var gl=grad('<stop offset="0" stop-color="'+warm+'" stop-opacity="'+(0.55*amt).toFixed(3)+'"/><stop offset="1" stop-color="'+warm+'" stop-opacity="0"/>','radialGradient','');
      var c = win.which==='R' ? P((r.a+r.b)/2, -0.02, (r.z0+r.z1)/2) : P(-0.02,(r.a+r.b)/2,(r.z0+r.z1)/2);
      s+='<g style="mix-blend-mode:screen"><ellipse cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" rx="'+((r.b-r.a)*TW*1.1).toFixed(1)+'" ry="'+((r.z1-r.z0)*ZH*1.0).toFixed(1)+'" fill="url(#'+gl+')"/></g>';
    });
  }

  /* 3) 灯光池 */
  if(L.pool>0.02 && rs.lit){
    var lights=entOf(area).filter(function(e){ return (e.domain==='light'||e.domain==='switch') && e.state==='on'; });
    var pts=lights.filter(function(e){ return e.kind==='ceiling_light'; })
                  .map(function(e){ return {u:e.anchor.u||0.5, v:e.anchor.v||0.5, b:(e.attributes.brightness||255)/255}; });
    if(!pts.length) pts=[{u:0.5,v:0.5,b:rs.bri||1}];
    pts.forEach(function(p){
      var amt=L.pool*(0.35+0.65*p.b), R=Math.max(w,d)*0.62*(rs.gain>1?1.08:1);
      var cx=w*p.u, cy=d*p.v, c=P(cx,cy,0.008);
      var id=grad('<stop offset="0" stop-color="#FFE2AE" stop-opacity="'+(0.95*amt).toFixed(3)+'"/>'+
                  '<stop offset="0.45" stop-color="#FFD08F" stop-opacity="'+(0.45*amt).toFixed(3)+'"/>'+
                  '<stop offset="1" stop-color="#FFC178" stop-opacity="0"/>','radialGradient','');
      s+='<g style="mix-blend-mode:screen"><ellipse cx="'+c[0].toFixed(1)+'" cy="'+c[1].toFixed(1)+'" rx="'+(R*TW*1.414).toFixed(1)+'" ry="'+(R*TH*1.414).toFixed(1)+'" fill="url(#'+id+')"/></g>';
      /* 墙面上的暖色渐变（自上而下衰减） */
      var wid=grad('<stop offset="0" stop-color="#FFDCA6" stop-opacity="'+(0.55*amt).toFixed(3)+'"/><stop offset="1" stop-color="#FFDCA6" stop-opacity="0"/>','linearGradient','x1="0" y1="0" x2="0" y2="1"');
      s+='<g style="mix-blend-mode:screen">'+
         faceX(0.006, 0,d, H*0.30,H, 'url(#'+wid+')')+
         faceY(0.006, 0,w, H*0.30,H, 'url(#'+wid+')')+'</g>';
      /* 灯具光晕 */
      var hc=P(cx,cy,H-0.12);
      var hid=grad('<stop offset="0" stop-color="#FFF0D0" stop-opacity="'+(0.85*amt).toFixed(3)+'"/><stop offset="1" stop-color="#FFE0A8" stop-opacity="0"/>','radialGradient','');
      s+='<g style="mix-blend-mode:screen"><ellipse cx="'+hc[0].toFixed(1)+'" cy="'+hc[1].toFixed(1)+'" rx="34" ry="24" fill="url(#'+hid+')"/></g>';
    });
  }
  return s;
}

/* 实体标记 pin */
function pinPos(area, e){
  var t=ROOMT[area.type], a=e.anchor;
  if(a.mode==='ceiling') return P(area.w*(a.u||0.5), area.d*(a.v||0.5), H-0.28);
  if(a.mode==='window'){
    var which=a.win||'R', r=winRect(area,which);
    return which==='R' ? P((r.a+r.b)/2, -0.05, (r.z0+r.z1)/2+0.25) : P(-0.05,(r.a+r.b)/2,(r.z0+r.z1)/2+0.25);
  }
  var tt=a.t||0.7, z=a.z||1.22;
  return a.wall==='R' ? P(area.w*tt, -0.05, z) : P(-0.05, area.d*tt, z);
}
function drawPins(area){
  if(!S.showPins) return '';
  var s='';
  entOf(area).forEach(function(e){
    var p=pinPos(area,e), on = e.domain==='cover' ? (e.attributes.current_position>0) : e.state==='on';
    var fill = on ? '#E8A33C' : '#7C8894';
    var ring = on ? '#FFF0D4' : '#E8EDF1';
    s+='<g class="pin" data-eid="'+e.entity_id+'" id="'+e.entity_id+'" transform="translate('+p[0].toFixed(1)+','+p[1].toFixed(1)+')">'+
       '<circle r="10.5" fill="'+ring+'" opacity="0.92"/>'+
       '<circle r="7.5" fill="'+fill+'"/>'+
       '<text x="0" y="3.2" text-anchor="middle" font-size="8.5" font-family="DM Mono, monospace" fill="#fff">'+DEVT[e.kind].icon+'</text>'+
       '</g>';
  });
  return s;
}

/* 一个整圆的子路径，供 evenodd 组合用 */
function disc(x,y,r){
  return 'M '+(x-r).toFixed(1)+','+y.toFixed(1)+
         ' A '+r.toFixed(1)+','+r.toFixed(1)+' 0 1,0 '+(x+r).toFixed(1)+','+y.toFixed(1)+
         ' A '+r.toFixed(1)+','+r.toFixed(1)+' 0 1,0 '+(x-r).toFixed(1)+','+y.toFixed(1)+' Z';
}

function skyBackdrop(vb){
  var R=Math.min(vb[2],vb[3])*0.36;
  var cx=vb[0]+vb[2]*0.74, cy=vb[1]+vb[3]*0.23;
  var s='';
  if(S.tod==='day'){
    var gl=grad('<stop offset="0" stop-color="#FFFDF6" stop-opacity="0.95"/>'+
                '<stop offset="0.55" stop-color="#FFF0D4" stop-opacity="0.30"/>'+
                '<stop offset="1" stop-color="#FFE7BC" stop-opacity="0"/>','radialGradient','');
    s+='<g opacity="0.66" style="pointer-events:none">';
    s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(R*1.85).toFixed(1)+'" fill="url(#'+gl+')"/>';
    s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+R.toFixed(1)+'" fill="#FFFCF2" opacity="0.62"/>';
    s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(R*1.26).toFixed(1)+'" fill="none" stroke="#FFF3DE" stroke-width="2.5" opacity="0.55"/>';
    s+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="'+(R*1.52).toFixed(1)+'" fill="none" stroke="#FFF3DE" stroke-width="1.5" opacity="0.32"/>';
    s+='</g>';
  } else {
    var mg=grad('<stop offset="0" stop-color="#CFDCF0" stop-opacity="0.55"/>'+
                '<stop offset="0.6" stop-color="#8FA6C6" stop-opacity="0.14"/>'+
                '<stop offset="1" stop-color="#6E86A8" stop-opacity="0"/>','radialGradient','');
    /* 月亮不跟太阳共用 R/cx/cy：太阳是一团弥散的光晕，溢出画面无所谓；月牙是个有轮廓的
       图形，整条轮廓都落在画面内才认得出来，所以另给一套更小的半径和圆心。 */
    var Rm=Math.min(vb[2],vb[3])*0.15;
    var mx=vb[0]+vb[2]*0.78, my=vb[1]+vb[3]*0.22;
    s+='<g opacity="0.62" style="pointer-events:none">';
    s+='<circle cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="'+(Rm*2.2).toFixed(1)+'" fill="url(#'+mg+')"/>';
    /* 月牙 = 整圆挖掉一个偏移的圆，两个子路径同属一条 path，靠 evenodd 抠出交集；
       挖口偏右上，对齐 🌙 的姿态，挖口圆越往左月牙越细。原来的环形山去掉了——
       细月牙上再点环形山只会糊成一团，面积的损失用更高的 opacity 补回来。 */
    s+='<path fill-rule="evenodd" fill="#DCE7F8" opacity="0.72" d="'+
       disc(mx,my,Rm)+' '+disc(mx+Rm*0.34,my-Rm*0.30,Rm*0.94)+'"/>';
    /* 疏星 */
    var st=[[0.10,0.10,2.2],[0.22,0.62,1.5],[0.06,0.78,1.8],[0.40,0.16,1.4],[0.55,0.72,1.9],[0.34,0.44,1.2],[0.90,0.66,1.6],[0.68,0.09,1.3]];
    st.forEach(function(k){
      s+='<circle cx="'+(vb[0]+vb[2]*k[0]).toFixed(1)+'" cy="'+(vb[1]+vb[3]*k[1]).toFixed(1)+'" r="'+k[2]+'" fill="#DCE7F8" opacity="0.42"/>';
    });
    s+='</g>';
  }
  return s;
}

function render(){
  defsHTML=''; gid=0;
  var areas=visibleAreas().slice().sort(function(a,b){ return (a.x+a.y)-(b.x+b.y) || a.x-b.x; });
  var body=skyBackdrop(viewBox());

  if(S.showGrid){
    var gg='';
    for(var i=-8;i<=34;i++){
      var A=P(i,-8), B=P(i,34), C=P(-8,i), D=P(34,i);
      var gc = S.tod==='night' ? 'rgba(150,175,205,.13)' : 'rgba(110,132,155,.20)';
      gg+='<line x1="'+A[0]+'" y1="'+A[1]+'" x2="'+B[0]+'" y2="'+B[1]+'" stroke="'+gc+'" stroke-width="1"/>';
      gg+='<line x1="'+C[0]+'" y1="'+C[1]+'" x2="'+D[0]+'" y2="'+D[1]+'" stroke="'+gc+'" stroke-width="1"/>';
    }
    body+='<g>'+gg+'</g>';
  }

  areas.forEach(function(a){
    var o=P(a.x,a.y,0), selq = S.sel&&S.sel.kind==='area'&&S.sel.id===a.area_id;
    var sh=P(a.x+a.w/2, a.y+a.d/2, 0);
    body+='<ellipse cx="'+sh[0].toFixed(1)+'" cy="'+(sh[1]+6).toFixed(1)+'" rx="'+((a.w+a.d)*0.30*TW).toFixed(1)+'" ry="'+((a.w+a.d)*0.30*TH).toFixed(1)+'" fill="rgba(0,0,0,'+(S.tod==='night'?0.32:0.14)+')"/>';
    body+='<g class="roomg" data-aid="'+a.area_id+'" transform="translate('+o[0].toFixed(1)+','+o[1].toFixed(1)+')">';
    body+=drawRoom(a);
    if(selq){
      body+=poly([P(-WT,-WT,0),P(a.w,-WT,0),P(a.w,a.d,0),P(-WT,a.d,0)],'none')
            .replace('fill="none"','fill="none" stroke="'+getCSS('--accent')+'" stroke-width="2.5" stroke-dasharray="6 4"');
    }
    if(S.showNames){

    }

  });

  var vb=viewBox();

  document.getElementById('zoomval').textContent=Math.round(S.zoom*100)+'%';
}
var vbOverride=null;
function viewBox(){
  if(vbOverride) return vbOverride;
  var W=vp.clientWidth||900, Hh=vp.clientHeight||600;
  return [ -W/2/S.zoom + S.pan.x, -Hh/2/S.zoom + S.pan.y, W/S.zoom, Hh/S.zoom ];
}
function getCSS(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function fitView(){
  var A=visibleAreas();
  if(!A.length){ S.pan={x:0,y:0}; S.zoom=1; render(); return; }
  var x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  A.forEach(function(a){
    [[a.x-WT,a.y-WT,H+0.4],[a.x+a.w,a.y-WT,0],[a.x+a.w,a.y+a.d,0],[a.x-WT,a.y+a.d,0],[a.x-WT,a.y-WT,0],[a.x+a.w,a.y+a.d,H]].forEach(function(c){
      var p=P(c[0],c[1],c[2]); x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]);
    });
  });
  var pad=70, W=vp.clientWidth||900, Hh=vp.clientHeight||600;
  S.zoom=Math.max(0.25, Math.min(1.45, Math.min((W-pad*2)/(x1-x0), (Hh-pad*2)/(y1-y0+50))));
  S.pan={x:(x0+x1)/2, y:(y0+y1)/2+12};
  render();
}

var drag=null;
function svgPoint(evt){
  var r=svg.getBoundingClientRect(), vb=viewBox();
  return { x: vb[0] + (evt.clientX-r.left)/r.width*vb[2], y: vb[1] + (evt.clientY-r.top)/r.height*vb[3] };
}
svg.addEventListener('pointerdown', function(e){
  var pin=e.target.closest('.pin');
  if(pin){ e.stopPropagation(); toggleEntity(pin.dataset.eid); return; }
  var g=e.target.closest('.roomg');
  if(g){
    var a=areaById(g.dataset.aid);
    select({kind:'area', id:a.area_id});
    var p=svgPoint(e), w=un(p.x,p.y);
    drag={aid:a.area_id, ox:w.x-a.x, oy:w.y-a.y, moved:false};
    svg.setPointerCapture(e.pointerId);
  } else {
    var p2=svgPoint(e);
    drag={panning:true, sx:e.clientX, sy:e.clientY, px:S.pan.x, py:S.pan.y};
    select(null);
    vp.classList.add('grab');
  }
});
svg.addEventListener('pointermove', function(e){
  if(!drag) return;
  if(drag.panning){
    var r=svg.getBoundingClientRect(), vb=viewBox();
    S.pan.x = drag.px - (e.clientX-drag.sx)/r.width*vb[2];
    S.pan.y = drag.py - (e.clientY-drag.sy)/r.height*vb[3];
    render(); return;
  }
  var p=svgPoint(e), w=un(p.x,p.y), a=areaById(drag.aid);
  var nx=Math.round(w.x-drag.ox), ny=Math.round(w.y-drag.oy);
  if(nx!==a.x || ny!==a.y){ a.x=nx; a.y=ny; drag.moved=true; render(); }
});
svg.addEventListener('pointerup', function(e){
  if(drag && drag.aid && drag.moved){ resolveOverlap(areaById(drag.aid)); render(); }
  drag=null; vp.classList.remove('grab');
});
svg.addEventListener('pointercancel', function(){ drag=null; vp.classList.remove('grab'); });
vp.addEventListener('wheel', function(e){
  e.preventDefault();
  S.zoom=Math.max(0.25, Math.min(2.4, S.zoom*(e.deltaY>0?0.9:1.11)));
  render();
}, {passive:false});

var GAP=2;
function overlaps(a,b){ return a.x < b.x+b.w+GAP && a.x+a.w+GAP > b.x && a.y < b.y+b.d+GAP && a.y+a.d+GAP > b.y; }
function resolveOverlap(a){
  var others=visibleAreas().filter(function(o){ return o!==a; });
  if(!others.some(function(o){ return overlaps(a,o); })) return;
  for(var r=1;r<=14;r++){
    for(var dx=-r; dx<=r; dx++) for(var dy=-r; dy<=r; dy++){
      if(Math.max(Math.abs(dx),Math.abs(dy))!==r) continue;
      var t={x:a.x+dx, y:a.y+dy, w:a.w, d:a.d};
      if(!others.some(function(o){ return overlaps(t,o); })){ a.x=t.x; a.y=t.y; return; }
    }
  }
}
function freeSpot(w,d){
  for(var r=0;r<=14;r++) for(var x=0;x<=r;x++) for(var y=0;y<=r;y++){
    if(Math.max(x,y)!==r) continue;
    var t={x:x*6, y:y*6, w:w, d:d};
    if(!visibleAreas().some(function(o){ return overlaps(t,o); })) return {x:t.x,y:t.y};
  }
  return {x:0,y:0};
}

function select(sel){ S.sel=sel; render(); renderRight(); renderDevPal(); renderFloorNav(); }
function toggleEntity(eid){
  var e=null; S.entities.forEach(function(x){ if(x.entity_id===eid) e=x; });
  if(!e) return;
  if(e.domain==='cover'){
    var p=e.attributes.current_position>0?0:100;
    e.attributes.current_position=p; e.state=p>0?'open':'closed';
  } else {
    e.state = e.state==='on'?'off':'on';
  }
  select({kind:'area', id:e.area_id});
}

var armed=null;

function floorThumb(f){
  var A=S.areas.filter(function(a){ return a.floor_id===f.floor_id; });
  var W=58, Hh=34;
  if(!A.length) return '<svg viewBox="0 0 '+W+' '+Hh+'" width="'+W+'" height="'+Hh+'"><text x="'+(W/2)+'" y="'+(Hh/2+3)+'" text-anchor="middle" font-size="8" font-family="DM Mono, monospace" fill="#8A97A3">'+esc(T('emptyFloor'))+'</text></svg>';
  var tw=4, th=2, pts=[], x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  A.forEach(function(a){
    var q=[[a.x,a.y],[a.x+a.w,a.y],[a.x+a.w,a.y+a.d],[a.x,a.y+a.d]].map(function(c){
      var px=(c[0]-c[1])*tw, py=(c[0]+c[1])*th;
      x0=Math.min(x0,px); x1=Math.max(x1,px); y0=Math.min(y0,py); y1=Math.max(y1,py);
      return [px,py];
    });
    pts.push({q:q, c:ROOMT[a.type].sw});
  });
  var sc=Math.min((W-6)/Math.max(1,x1-x0), (Hh-6)/Math.max(1,y1-y0));
  var ox=(W-(x1-x0)*sc)/2 - x0*sc, oy=(Hh-(y1-y0)*sc)/2 - y0*sc;
  var body=pts.map(function(o){
    return '<polygon points="'+o.q.map(function(c){ return (c[0]*sc+ox).toFixed(1)+','+(c[1]*sc+oy).toFixed(1); }).join(' ')+
      '" fill="'+o.c+'" fill-opacity="0.72" stroke="'+o.c+'" stroke-width="0.7"/>';
  }).join('');
  return '<svg viewBox="0 0 '+W+' '+Hh+'" width="'+W+'" height="'+Hh+'">'+body+'</svg>';
}
function renderFloorNav(){
  var el=document.getElementById('floornav');
  var html='<div class="fnhead"><span>'+esc(T('floors'))+'</span><span class="mono">'+S.floors.length+'</span></div>';
  S.floors.forEach(function(f,i){
    var n=S.areas.filter(function(a){ return a.floor_id===f.floor_id; }).length;
    var ents=S.entities.filter(function(e){ return e.floor_id===f.floor_id; }).length;
    html+='<div class="fnrow'+(f.floor_id===S.activeFloor?' act':'')+'" data-fid="'+f.floor_id+'">'+
      '<span class="fnthumb">'+floorThumb(f)+'</span>'+
      '<span class="fnmeta"><b>'+esc(floorName(f))+'</b><span>'+esc(T('floorMeta',{r:n, e:ents}))+'</span></span>'+
      '<span class="fnord">'+
        (i>0 ? '<button data-mv="up" data-fid="'+f.floor_id+'" title="'+esc(T('moveUp'))+'">▲</button>' : '')+
        (i<S.floors.length-1 ? '<button data-mv="dn" data-fid="'+f.floor_id+'" title="'+esc(T('moveDown'))+'">▼</button>' : '')+
      '</span></div>';
  });
  html+='<div class="fnbtns"><button id="fn-add">'+esc(T('addFloor'))+'</button>'+
        (S.floors.length>1 ? '<button id="fn-del">'+esc(T('delFloor'))+'</button>' : '')+'</div>';
  el.innerHTML=html;
  el.querySelectorAll('.fnrow').forEach(function(r){
    r.addEventListener('click', function(ev){
      if(ev.target.closest('[data-mv]')) return;
      S.activeFloor=r.dataset.fid; S.sel=null;
      renderFloorNav(); fitView(); renderRight(); renderDevPal();
    });
  });
  el.querySelectorAll('[data-mv]').forEach(function(btn){
    btn.addEventListener('click', function(ev){
      ev.stopPropagation();
      moveFloor(btn.dataset.fid, btn.dataset.mv==='up'?-1:1);
    });

  var add=document.getElementById('fn-add'); if(add) add.onclick=addFloor;
  var del=document.getElementById('fn-del'); if(del) del.onclick=deleteFloor;
}
function moveFloor(fid, dir){
  var i=S.floors.findIndex(function(f){ return f.floor_id===fid; });
  var j=i+dir;
  if(i<0 || j<0 || j>=S.floors.length) return;
  var t=S.floors[i]; S.floors[i]=S.floors[j]; S.floors[j]=t;
  renumberFloors();
  renderFloorNav(); renderRight();
  toast(T('t.floorOrder'));
}
function addFloor(){
  var n=S.floors.length+1, id='floor_'+n;
  while(S.floors.some(function(f){ return f.floor_id===id; })){ n++; id='floor_'+n; }
  var f={floor_id:id, level:0};
  S.floors.unshift(f);
  renumberFloors();
  S.activeFloor=id; S.sel=null;
  /* 新楼层不留空：预置一个客厅 + 一间主卧 */
  [['living',0,0],['master',7,0]].forEach(function(p){
    var a=newArea(p[0],p[1],p[2]); S.areas.push(a); seedEntities(a);
  });
  S.entities.forEach(function(e){ if(e.floor_id===id && e.domain!=='cover') e.state='off'; });
  renderFloorNav(); fitView(); renderRight(); renderDevPal();
  toast(T('t.floorAdded',{n:floorName(f)}));
}
function deleteFloor(){
  if(S.floors.length<2){ toast(T('t.keepOne')); return; }
  var fid=S.activeFloor;
  var f=S.floors.filter(function(x){ return x.floor_id===fid; })[0];
  var fname=f?floorName(f):'';
  S.floors=S.floors.filter(function(x){ return x.floor_id!==fid; });
  S.areas=S.areas.filter(function(a){ return a.floor_id!==fid; });
  S.entities=S.entities.filter(function(e){ return e.floor_id!==fid; });
  renumberFloors();
  S.activeFloor=S.floors[0].floor_id; S.sel=null;
  renderFloorNav(); fitView(); renderRight(); renderDevPal();
  toast(T('t.floorDel',{n:fname}));
}

var MX=[
  ['day','open','off'], ['day','open','on'], ['day','closed','off'], ['day','closed','on'],
  ['night','open','off'], ['night','open','on'], ['night','closed','off'], ['night','closed','on']
];
function currentKey(){
  var A=visibleAreas(); if(!A.length) return null;
  var lit=0, open=0;
  A.forEach(function(a){ var rs=roomState(a); if(rs.lit) lit++; if(rs.cov>0.5) open++; });

}
function renderMatrix(){
  var el=document.getElementById('matrix'), cur=currentKey();

function applyPreset(tod, cov, on){
  S.tod=tod;
  var bri=+document.getElementById('g-bri').value/100;
  S.entities.forEach(function(e){
    if(e.floor_id!==S.activeFloor) return;

      var p = cov==='open'?100:0;

function contentBox(){
  var A=visibleAreas(), x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  A.forEach(function(a){
    [[a.x-WT,a.y-WT,H+0.5],[a.x+a.w,a.y-WT,0],[a.x+a.w,a.y+a.d,0],[a.x-WT,a.y+a.d,0],[a.x+a.w,a.y+a.d,H]].forEach(function(c){
      var p=P(c[0],c[1],c[2]); x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); y0=Math.min(y0,p[1]); y1=Math.max(y1,p[1]);
    });
  });
  var pad=46;
  return {x:x0-pad, y:y0-pad, w:(x1-x0)+pad*2, h:(y1-y0)+pad*2+26};
}
function exportSVG(){
  var box=contentBox();
  vbOverride=[box.x, box.y, box.w, box.h];
  render();
  var bg = S.tod==='night'?'#12161C':LIGHT[lkey(S.tod,1,false)].bg;
  var out='<svg xmlns="http://www.w3.org/2000/svg" width="'+Math.round(box.w)+'" height="'+Math.round(box.h)+
    '" viewBox="'+box.x+' '+box.y+' '+box.w+' '+box.h+'"><rect x="'+box.x+'" y="'+box.y+'" width="'+box.w+'" height="'+box.h+'" fill="'+bg+'"/>'+svg.innerHTML+'</svg>';
  vbOverride=null; render();
  return {svg:out, box:box};
}
function exportPNG(cb){
  var r=exportSVG(), scale=2;
  var img=new Image();
  img.onload=function(){
    var c=document.createElement('canvas');
    c.width=Math.round(r.box.w*scale); c.height=Math.round(r.box.h*scale);
    var g=c.getContext('2d'); g.drawImage(img,0,0,c.width,c.height);
    cb(c.toDataURL('image/png'), r);
  };
  img.onerror=function(){ cb(null, r); };
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(r.svg);
}

/* picture-elements：坐标换算成 viewBox 内百分比 */
function pinPercents(box){
  var out=[];
  visibleAreas().forEach(function(a){
    var o=P(a.x,a.y,0);
    entOf(a).forEach(function(e){
      var p=pinPos(a,e);
      out.push({ e:e, left:((o[0]+p[0]-box.x)/box.w*100), top:((o[1]+p[1]-box.y)/box.h*100) });
    });
  });
  return out;
}
function yamlPictureElements(box){
  var pins=pinPercents(box);
  var L=[];
  L.push('# Generated by MK-Smart Home Lab — native picture-elements card, no custom components needed');
  L.push('# 1) Save the exported PNG to config/www/floorplan/home.png');
  L.push('# 2) Create a dashboard, switch it to YAML mode, paste this in');
  L.push('type: picture-elements');
  L.push('image: /local/floorplan/home.png');
  L.push('elements:');
  pins.forEach(function(p){
    var e=p.e, isCover=e.domain==='cover';
    L.push('  - type: state-icon');
    L.push('    entity: '+e.entity_id);
    L.push('    title: '+JSON.stringify(entName(e)));
    L.push('    tap_action:');
    L.push('      action: '+(isCover?'more-info':'toggle'));
    L.push('    hold_action:');
    L.push('      action: more-info');
    L.push('    style:');
    L.push('      top: '+p.top.toFixed(2)+'%');
    L.push('      left: '+p.left.toFixed(2)+'%');
    L.push('      "--mdc-icon-size": 26px');
    L.push('      "--paper-item-icon-color": "#7C8894"');
    L.push('      "--paper-item-icon-active-color": "#E8A33C"');
  });
  return L.join('\n');
}
function yamlFloorplan(){
  var L=[];
  L.push('# Generated by MK-Smart Home Lab — config for ExperienceLovelace/ha-floorplan (HACS)');
  L.push('# In the exported SVG every marker id IS its entity_id, so rules bind straight by id');
  L.push('title: '+JSON.stringify(S.name));
  L.push('image: /local/floorplan/home.svg');
  L.push('stylesheet: /local/floorplan/home.css');
  L.push('defaults:');
  L.push('  hover_action: hover-info');
  L.push('  tap_action: toggle');
  L.push('rules:');
  var doms={};
  S.entities.filter(function(e){ return e.floor_id===S.activeFloor; }).forEach(function(e){ (doms[e.domain]=doms[e.domain]||[]).push(e); });
  Object.keys(doms).forEach(function(dm){
    L.push('  - name: '+dm+' devices');
    L.push('    entities:');
    doms[dm].forEach(function(e){ L.push('      - '+e.entity_id); });
    L.push('    element: ${entity.entity_id}');
    L.push('    tap_action: '+(dm==='cover'?'more-info':'toggle'));
    L.push('    state_action:');
    L.push('      service: floorplan.class_set');
    if(dm==='cover'){
      L.push('      service_data: >');
      L.push('        ${entity.attributes.current_position > 0 ? "cover-open" : "cover-closed"}');
    } else {
      L.push('      service_data: >');
      L.push('        ${entity.state === "on" ? "'+dm+'-on" : "'+dm+'-off"}');
    }
  });
  return L.join('\n');
}
var FLOORPLAN_CSS = [
'/* home.css — for use with ha-floorplan */',
'svg, svg * { pointer-events: none; }',
'[id^="light."], [id^="switch."], [id^="cover."] { pointer-events: auto; cursor: pointer; }',
'.light-on   circle:nth-of-type(2) { fill: #E8A33C; }',
'.light-off  circle:nth-of-type(2) { fill: #7C8894; }',
'.switch-on  circle:nth-of-type(2) { fill: #E8A33C; }',
'.switch-off circle:nth-of-type(2) { fill: #7C8894; }',
'.cover-open   circle:nth-of-type(2) { fill: #45C2CE; }',
'.cover-closed circle:nth-of-type(2) { fill: #7C8894; }'
].join('\n');

function sceneJSON(){
  return JSON.stringify({
    schema:'iso-floorplan/1',
    home:{ name:S.name },
    floors:S.floors.map(function(f){ return {floor_id:f.floor_id, name:floorName(f), level:f.level}; }),
    areas:S.areas.map(function(a){
      return {area_id:a.area_id, name:areaName(a), floor_id:a.floor_id, room_type:a.type,
              layout:{x:a.x, y:a.y, w:a.w, d:a.d}};
    }),
    entities:S.entities.map(function(e){
      return {entity_id:e.entity_id, area_id:e.area_id, floor_id:e.floor_id, domain:e.domain,
              device_kind:e.kind, friendly_name:entName(e), state:e.state,
              attributes:e.attributes, anchor:e.anchor};
    }),
    scene:{ time_of_day:S.tod, light_matrix_key:currentKey(), locale:S.lang },
    projection:{ type:'dimetric_2to1', tile:{w:TW,h:TH,z:ZH}, wall_height:H }
  }, null, 2);
}

var tabState='pe';
function openHA(){
  if(!visibleAreas().length){ toast(T('t.needRooms')); return; }
  exportPNG(function(dataURL, r){
    var box=r.box;
    var payload={
      pe:{d:T('cb.pe'), c:yamlPictureElements(box)},
      fp:{d:T('cb.fp'), c:yamlFloorplan()},
      css:{d:T('cb.css'), c:FLOORPLAN_CSS},
      json:{d:T('cb.json'), c:sceneJSON()}
    };
    var order=[['pe','picture-elements'],['fp','floorplan.yaml'],['css','home.css'],['json','scene.json'],['img',T('tab.img')]];
    function paint(){
      var body='<div class="tabs">'+order.map(function(o){
        return '<button data-tab="'+o[0]+'" aria-selected="'+(tabState===o[0])+'">'+o[1]+'</button>';
      }).join('')+'</div>';
      if(tabState==='img'){
        body+='<div class="callout">'+esc(T('cb.img'))+'</div>';
        body+= dataURL ? '<a href="'+dataURL+'" download="home.png"><img src="'+dataURL+'" alt=""></a>'
                       : '<div class="empty">'+esc(T('renderFail'))+'</div>';
      } else {
        var p=payload[tabState];
        body+='<div class="callout">'+p.d+'</div><pre class="code" id="codeblk">'+esc(p.c)+'</pre>';
      }
      document.getElementById('modal-body').innerHTML=body;
      document.getElementById('modal-copy').hidden = tabState==='img';
      document.getElementById('modal-body').querySelectorAll('[data-tab]').forEach(function(b){
        b.addEventListener('click', function(){ tabState=b.dataset.tab; paint(); });
      });
    }
    document.getElementById('modal-title').textContent=T('haTitle');
    document.getElementById('modal-desc').textContent=T('haDesc');
    document.getElementById('modal').hidden=false;
    paint();
    document.getElementById('modal-copy').onclick=function(){
      var txt=payload[tabState].c;
      if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(function(){ toast(T('t.copied')); },function(){ selectCode(); });
      else selectCode();
    };
    function selectCode(){
      var el=document.getElementById('codeblk'); if(!el) return;
      var rg=document.createRange(); rg.selectNodeContents(el);
      var sel=window.getSelection(); sel.removeAllRanges(); sel.addRange(rg);
      toast(T('t.selectCopy'));
    }
  });
}

/* ═══════════════════════════════════════════════════════════
   12 · 示例 & 启动
   ═══════════════════════════════════════════════════════════ */
function loadSample(){
  S.areas=[]; S.entities=[]; seq=0;
  S.floors=[{floor_id:'floor_1', level:0}];
  S.activeFloor='floor_1';
  var plan=[['living',0,0],['dining',7,0],['kitchen',13,0],
            ['entry',0,6],['hall',4,6],['balcony',13,5],
            ['master',0,10],['bath',6,10],['bedroom',11,10],['study',16,10]];
  plan.forEach(function(p){
    var a=newArea(p[0],p[1],p[2]); S.areas.push(a); seedEntities(a);
  });
  S.tod='day'; syncTod();
  S.entities.forEach(function(e){ if(e.domain!=='cover') e.state='off'; });
  S.sel=null;
}
/* ── 语言切换：静态文案 + 全量重绘 ── */
function applyStaticI18n(){
  document.documentElement.lang = S.lang;
  var nodes=document.querySelectorAll('[data-i18n]');
  for(var i=0;i<nodes.length;i++){
    var el=nodes[i];
    el.textContent = (el.getAttribute('data-pre')||'') + T(el.getAttribute('data-i18n'));
  }
}
function buildLangSel(){
  var el=document.getElementById('lang');
  el.innerHTML = LANGS.map(function(l){
    return '<option value="'+l[0]+'"'+(l[0]===S.lang?' selected':'')+'>'+l[1]+'</option>';
  }).join('');
  el.onchange=function(){ setLang(el.value); };
}
function setLang(code){
  if(!I18N[code]) return;
  S.lang=code;
  try{ localStorage.setItem('mk-lab-lang', code); }catch(e){}
  applyStaticI18n();
  renderRoomPal(); renderDevPal(); renderFloorNav(); render(); renderRight();
}

var toastT;
function toast(m){
  var o=document.querySelector('.toast'); if(o) o.remove();
  var t=document.createElement('div'); t.className='toast'; t.textContent=m;
  document.body.appendChild(t); clearTimeout(toastT);
  toastT=setTimeout(function(){ t.remove(); }, 2100);
}

function boot(){
  S.lang=detectLang();
  applyStaticI18n(); buildLangSel();
  loadSample();
  renderRoomPal(); renderDevPal(); renderFloorNav();
  fitView(); renderRight();

  document.getElementById('tod-day').onclick=function(){ S.tod='day'; syncTod(); render(); renderMatrix(); };
  document.getElementById('tod-night').onclick=function(){ S.tod='night'; syncTod(); render(); renderMatrix(); };
  document.getElementById('all-on').onclick=function(){
    var bri=+document.getElementById('g-bri').value/100;
    S.entities.forEach(function(e){ if(e.domain!=='cover'&&e.floor_id===S.activeFloor){ e.state='on'; if(e.domain==='light') e.attributes.brightness=Math.round(bri*255); } });
    select(S.sel);
  };
  document.getElementById('all-off').onclick=function(){
    S.entities.forEach(function(e){ if(e.domain!=='cover'&&e.floor_id===S.activeFloor) e.state='off'; });
    select(S.sel);
  };
  document.getElementById('g-bri').oninput=function(e){
    var v=+e.target.value; document.getElementById('g-bri-v').textContent=v+'%';
    S.entities.forEach(function(x){ if(x.domain==='light'&&x.floor_id===S.activeFloor) x.attributes.brightness=Math.round(v/100*255); });
    render(); renderRight();
  };
  document.getElementById('g-cov').oninput=function(e){
    var v=+e.target.value; document.getElementById('g-cov-v').textContent=v+'%';
    S.entities.forEach(function(x){ if(x.domain==='cover'&&x.floor_id===S.activeFloor){ x.attributes.current_position=v; x.state=v>0?'open':'closed'; } });
    render(); renderRight();
  };
  document.getElementById('zoom-in').onclick=function(){ S.zoom=Math.min(2.4,S.zoom*1.16); render(); };
  document.getElementById('zoom-out').onclick=function(){ S.zoom=Math.max(0.25,S.zoom/1.16); render(); };
  document.getElementById('zoom-fit').onclick=fitView;
  document.getElementById('btn-del').onclick=delSelected;
  document.getElementById('btn-sample').onclick=function(){ loadSample(); fitView(); renderRight(); renderFloorNav(); renderDevPal(); toast(T('t.sample')); };
  document.getElementById('btn-ha').onclick=openHA;
  document.getElementById('btn-png').onclick=function(){
    if(!visibleAreas().length){ toast(T('t.needRooms')); return; }
    exportPNG(function(u){
      document.getElementById('modal-title').textContent=T('pngTitle');
      document.getElementById('modal-desc').textContent=T('pngDesc');
      document.getElementById('modal-body').innerHTML = u? '<a href="'+u+'" download="floorplan.png"><img src="'+u+'" alt=""></a>':'<div class="empty">'+esc(T('renderFail'))+'</div>';
      document.getElementById('modal-copy').hidden=true;
      document.getElementById('modal').hidden=false;
    });
  };
  document.getElementById('modal-close').onclick=function(){ document.getElementById('modal').hidden=true; };
  document.getElementById('t-pins').onchange=function(e){ S.showPins=e.target.checked; render(); };
  document.getElementById('t-names').onchange=function(e){ S.showNames=e.target.checked; render(); };
  document.getElementById('t-grid').onchange=function(e){ S.showGrid=e.target.checked; render(); };

  document.addEventListener('keydown', function(e){
    if(/input|textarea|select/i.test(e.target.tagName)) return;
    if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); delSelected(); }
    if(e.key==='Escape'){ document.getElementById('modal').hidden=true; armed=null; renderRoomPal(); }
    if(e.key==='d'||e.key==='D'){ S.tod = S.tod==='day'?'night':'day'; syncTod(); render(); renderMatrix(); }
  });
  var lastW=0, lastH=0;
  new ResizeObserver(function(){
    var w=vp.clientWidth, h=vp.clientHeight;
    if(Math.abs(w-lastW)>2 || Math.abs(h-lastH)>2){ lastW=w; lastH=h; fitView(); }
    else render();
  }).observe(vp);
  var mq=window.matchMedia('(prefers-color-scheme: dark)');
  if(mq.addEventListener) mq.addEventListener('change', render);
  new MutationObserver(render).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
}
if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', boot); else boot();
})();
</script>
